[tool.poetry]
name = "pythonproject3"
version = "0.1.0"
description = ""
authors = ["Doris"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
requests = "^2.32.5"
flake8 = "^7.3.0"
mypy = "^1.18.2"
isort = "^7.0.0"
black = "^25.11.0"
pytest = "^9.0.1"
python-dotenv = "^1.2.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.black]
line-length = 119
exclude = '''
/(
    \.venv|
    \.git|
    \.mypy_cache|
    \.pytest_cache|
    build|
    dist
)/
'''

[tool.isort]
line_length = 119
multi_line_output = 3

[tool.mypy]
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = 'venv'